name: Publish v0.1.0 preview release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0.1.0-preview-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify repository version
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "versionName[[:space:]]+['\"]0[.]1[.]0['\"]" app/build.gradle
          grep -Eq "versionCode[[:space:]]+1([[:space:]]|[;}])" app/build.gradle
      - name: Run tests, lint and build preview
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Prepare labelled preview APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/network-analyzer-v0.1.0-debug.apk
          (cd dist && sha256sum network-analyzer-v0.1.0-debug.apk > SHA256SUMS.txt)
          unzip -t dist/network-analyzer-v0.1.0-debug.apk >/dev/null
      - name: Publish GitHub prerelease with preview APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists, refusing to overwrite."
            exit 1
          fi
          gh release create v0.1.0 \
            "dist/network-analyzer-v0.1.0-debug.apk" \
            "dist/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "Network Analyzer v0.1.0 — versión de pruebas" \
            --notes-file RELEASE_NOTES_v0.1.0.md \
            --prerelease \
            --latest=false
